<link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
<style>
  :root {
    --bg:#0f172a; --card:#fff; --muted:#64748b; --text:#111827; --line:#e5e7eb;
    --accent:#2563eb; --warn:#dc2626; --amber:#b45309; --green:#047857; --shadow:0 1px 3px rgba(15,23,42,.08);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:var(--text); background:#f8fafc; }
  header { padding:15px 18px; background:var(--bg); color:white; display:flex; gap:12px; justify-content:space-between; align-items:flex-start; }
  header h1 { margin:0 0 6px; font-size:20px; line-height:1.15; }
  header p { margin:0; color:#cbd5e1; font-size:14px; line-height:1.35; }
  .langBtns { display:flex; gap:8px; flex:0 0 auto; }
  .langBtns button { border:1px solid rgba(255,255,255,.35); background:#1e293b; color:white; border-radius:999px; padding:8px 11px; font-weight:800; }
  .langBtns button.active { background:white; color:#0f172a; }
  .layout { display:grid; grid-template-columns:450px 1fr; min-height:calc(100vh - 80px); }
  aside { overflow:auto; max-height:calc(100vh - 80px); border-right:1px solid var(--line); background:#f8fafc; padding:14px; }
  #map { min-height:calc(100vh - 80px); width:100%; background:#e2e8f0; position:relative; overflow:hidden; }
  .sectionTitle { font-size:15px; margin:18px 0 8px; color:#0f172a; }
  .card,.parkingItem,.notice { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; box-shadow:var(--shadow); }
  .cardTop { display:flex; gap:10px; align-items:flex-start; }
  .badge { flex:0 0 auto; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:white; font-weight:900; background:var(--accent); }
  .monument .badge { background:var(--green); } .food .badge { background:var(--amber); } .start .badge { background:#475569; }
  p { font-size:13px; color:#334155; line-height:1.38; margin:8px 0; }
  .addr { font-size:12px; color:var(--muted); margin:6px 0 10px; }
  .btn { display:inline-block; text-decoration:none; font-size:13px; font-weight:800; padding:8px 10px; border-radius:10px; background:var(--accent); color:white; margin-top:8px; }
  .btn.secondary { background:#334155; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px; }
  .toolbar button { border:1px solid var(--line); background:white; border-radius:10px; padding:8px 10px; font-weight:800; }
  .legend { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px; color:#334155; margin-top:8px; }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .blue { background:var(--accent); } .green { background:var(--green); } .amber { background:var(--amber); } .red { background:var(--warn); }
  .leaflet-popup-content { font-size:13px; line-height:1.35; }
  .popupTitle { font-weight:900; margin-bottom:4px; }
  .popupBtn { display:inline-block; margin-top:7px; padding:6px 8px; border-radius:8px; background:#2563eb; color:white !important; text-decoration:none; font-weight:900; }
  .small { font-size:12px; color:#475569; }
  details { margin-top:8px; }
  summary { cursor:pointer; font-size:13px; font-weight:900; color:#0f172a; margin-top:8px; }
  ul { margin:7px 0 0 18px; padding:0; }
  li { font-size:12.5px; line-height:1.35; margin:5px 0; color:#334155; }
  .tipGroup { margin:8px 0 0; padding:8px 9px; border-radius:10px; background:#f8fafc; border:1px solid #e2e8f0; }
  .tipGroup b { display:block; font-size:12.5px; margin-bottom:3px; color:#0f172a; }
  .sourceLinks a { display:block; margin:6px 0; font-size:12px; color:#1d4ed8; }

  .fallbackMap {
    position:absolute; inset:0; background:
      radial-gradient(circle at 70% 70%, rgba(59,130,246,.16), transparent 28%),
      linear-gradient(135deg, rgba(255,255,255,.45) 0 25%, transparent 25% 50%, rgba(255,255,255,.45) 50% 75%, transparent 75%),
      #dbeafe;
    background-size:100% 100%, 34px 34px, auto;
  }
  .fallbackTitle {
    position:absolute; top:12px; left:12px; right:12px; z-index:5;
    background:rgba(255,255,255,.94); border:1px solid #cbd5e1; border-radius:14px; padding:10px 12px;
    box-shadow:var(--shadow); font-size:13px;
  }
  .fallbackMarker, .fallbackParking {
    position:absolute; transform:translate(-50%,-50%); z-index:4; border:2px solid white; color:white;
    box-shadow:0 1px 7px rgba(15,23,42,.35); cursor:pointer; display:grid; place-items:center; font-weight:900;
  }
  .fallbackMarker { width:31px; height:31px; border-radius:50%; background:var(--accent); }
  .fallbackMarker.monument { background:var(--green); }
  .fallbackMarker.food { background:var(--amber); }
  .fallbackMarker.start { background:#475569; }
  .fallbackParking { width:29px; height:29px; border-radius:8px; background:#111827; }
  .fallbackPopup {
    position:absolute; left:12px; right:12px; bottom:12px; z-index:6; background:white; border:1px solid #cbd5e1;
    border-radius:14px; padding:12px; box-shadow:0 6px 18px rgba(15,23,42,.22); max-height:38vh; overflow:auto;
  }
  .fallbackPopup .closeBtn { float:right; border:0; background:#e2e8f0; border-radius:8px; padding:4px 8px; font-weight:900; }
  .fallbackLine { stroke:#2563eb; stroke-width:3; stroke-dasharray:7 7; fill:none; opacity:.62; }
  .fallbackClosure { fill:rgba(220,38,38,.14); stroke:#dc2626; stroke-width:2; stroke-dasharray:5 5; }
  .mapError { color:#334155; margin-top:4px; font-size:12px; }
  @media (max-width:860px) {
    header { display:block; } .langBtns { margin-top:10px; } .layout { grid-template-columns:1fr; }
    aside { max-height:none; border-right:0; border-bottom:1px solid var(--line); } #map { min-height:70vh; }
  }
</style>

er navegación; las rutas del centro cambian rápido hoy.", "Poner como primer destino el garage, no el museo, si no van a hacer bajadas rápidas."], "Parking": ["El primer destino real de parking debe ser L’Enfant Plaza si quieren un garage central.", "Estacionarse en la calle cerca del Mall es mala apuesta hoy por cierres y zonas de seguridad."], "Estrategia adentro": ["Decidir antes de salir: plan completo de museos o versión ligera si el tráfico está malo."], "Respaldo": ["Si salen después de 2:20 PM, cortar un museo: normalmente Spy si no hay boletos, o American Art si lo principal es Air and Space."]}}}, {"num": "1", "time": "2:45–4:10 PM", "lat": 38.8879, "lon": -77.0199, "type": "museum", "gmaps": "https://www.google.com/maps/search/?api=1&query=National+Air+and+Space+Museum+650+Jefferson+Dr+SW+Washington+DC", "en": {"name": "National Air and Space Museum", "address": "650 Jefferson Dr SW, Washington, DC", "desc": "Priority stop because it closes earliest and requires free timed-entry passes. Do it as a highlights visit, not the whole museum.", "must": ["1903 Wright Flyer — first successfully powered airplane.", "Apollo 11 Command Module Columbia — one of the strongest must-see objects.", "TEXTRON How Things Fly — hands-on interactives for teens.", "Boeing Milestones of Flight Hall — fastest big-picture aviation/space overview.", "New 2026 exhibitions — several galleries reopened July 1, so expect demand."], "interesting": ["Part of the museum remains in transformation, so check open exhibitions rather than assuming old galleries are available.", "Your pass lets you stay as long as you want once inside, but if you exit you need a separate pass to re-enter."], "tips": {"Arrival/drop-off": ["Drop grandparents at the Jefferson Drive entrance if heat is bad.", "If arriving late, do not browse the lobby; go straight to the highlighted objects."], "Parking": ["Best practical parking: L’Enfant Plaza Garage, 420 10th St SW, then walk or short Uber.", "Avoid trying to circle Jefferson Drive/Independence Avenue for street parking today."], "Inside strategy": ["Pick three: Wright Flyer, Apollo 11 Columbia, How Things Fly.", "Set a hard exit alarm for 4:05 PM so the rest of the day survives."], "Backup": ["No timed pass: skip this stop and use American Art / Portrait Gallery as the first museum.", "If the group is hot/tired, do only Boeing Milestones plus Apollo 11, then leave."]}}, "es": {"name": "Museo Nacional del Aire y el Espacio", "address": "650 Jefferson Dr SW, Washington, DC", "desc": "Primera prioridad porque cierra más temprano y requiere pases gratuitos con horario. Hacerlo como visita de puntos principales, no como museo completo.", "must": ["1903 Wright Flyer — primer avión con motor que voló con éxito.", "Apollo 11 Command Module Columbia — uno de los objetos más importantes para ver.", "TEXTRON How Things Fly — interactivo y bueno para adolescentes.", "Boeing Milestones of Flight Hall — resumen rápido de aviación y espacio.", "Exhibiciones nuevas 2026 — varias galerías reabrieron el 1 de julio, así que puede haber demanda."], "interesting": ["Parte del museo sigue en transformación, así que conviene revisar exhibiciones abiertas y no asumir que todo lo antiguo está disponible.", "El pase permite quedarse dentro sin límite, pero si salen necesitan otro pase para reentrar."], "tips": {"Llegada/bajada": ["Bajar a los abuelos en la entrada de Jefferson Drive si el calor está fuerte.", "Si llegan tarde, no perder tiempo en el lobby; ir directo a los objetos principales."], "Parking": ["Mejor parking práctico: L’Enfant Plaza Garage, 420 10th St SW, y caminar o tomar Uber corto.", "Evitar dar vueltas por Jefferson Drive/Independence Avenue buscando calle hoy."], "Estrategia adentro": ["Escoger tres: Wright Flyer, Apollo 11 Columbia, How Things Fly.", "Poner alarma de salida a las 4:05 PM para que el resto del día funcione."], "Respaldo": ["Sin pase con horario: saltar este stop y empezar con American Art / Portrait Gallery.", "Si el grupo está cansado o con calor, hacer solo Boeing Milestones y Apollo 11, luego salir."]}}}, {"num": "2", "time": "4:25–6:00 PM", "lat": 38.8978, "lon": -77.023, "type": "museum", "gmaps": "https://www.google.com/maps/search/?api=1&query=Smithsonian+American+Art+Museum+8th+and+G+St+NW+Washington+DC", "en": {"name": "Smithsonian American Art Museum / National Portrait Gallery", "address": "8th & G St NW, Washington, DC", "desc": "Indoor AC, no ticket required, and open later than most Smithsonian museums. It shares one historic building with the National Portrait Gallery.", "must": ["Kogod Courtyard — best seated AC break.", "America’s Presidents — complete presidential portrait collection outside the White House.", "SAAM collection highlights — American art from early work to modern/contemporary.", "Historic Patent Office Building — the building itself is part of the visit.", "Latinx and American sculpture areas — good less-generic collection areas."], "interesting": ["This building was the old U.S. Patent Office.", "The courtyard is the recovery stop: sit, cool down, and reset before Spy Museum."], "tips": {"Arrival/drop-off": ["Use 8th & G St NW as the walking target.", "If someone is parking, drop the grandparents near the entrance and meet inside at Kogod Courtyard."], "Parking": ["Use a Gallery Place/Penn Quarter paid garage near 8th & G; do not plan around street parking.", "If traffic northbound looks ugly, skip this and stay near L’Enfant/Wharf."], "Inside strategy": ["Start with Kogod Courtyard first, not last.", "Do Presidents + one SAAM wing; do not split the group across multiple floors unless phones are charged."], "Backup": ["If arrival is after 5:30, make it only Kogod Courtyard + Presidents.", "If the teens are bored, use it as a 30-minute cooling stop, not a full museum."]}}, "es": {"name": "Museo Smithsonian de Arte Americano / Galería Nacional de Retratos", "address": "8th & G St NW, Washington, DC", "desc": "Con aire acondicionado, sin boleto, y abierto más tarde que muchos museos Smithsonian. Comparte edificio histórico con la Galería Nacional de Retratos.", "must": ["Kogod Courtyard — mejor pausa sentados con aire acondicionado.", "America’s Presidents — colección completa de retratos presidenciales fuera de la Casa Blanca.", "Obras principales del SAAM — arte americano desde temprano hasta moderno/contemporáneo.", "Antigua Oficina de Patentes — el edificio también es parte de la visita.", "Áreas Latinx y de escultura americana — buenas zonas menos típicas."], "interesting": ["Este edificio fue la antigua Oficina de Patentes de EE.UU.", "El courtyard es la parada de recuperación: sentarse, enfriarse y reiniciar antes del Spy Museum."], "tips": {"Llegada/bajada": ["Usar 8th & G St NW como punto de llegada.", "Si alguien va a estacionar, bajar a los abuelos cerca de la entrada y reunirse en Kogod Courtyard."], "Parking": ["Usar un garage pagado de Gallery Place/Penn Quarter cerca de 8th & G; no contar con calle.", "Si el tráfico hacia el norte está feo, saltarlo y quedarse cerca de L’Enfant/Wharf."], "Estrategia adentro": ["Empezar con Kogod Courtyard, no dejarlo para el final.", "Hacer Presidentes + una ala del SAAM; no dividir al grupo por pisos si los celulares no tienen batería."], "Respaldo": ["Si llegan después de 5:30, hacerlo solo como Kogod Courtyard + Presidentes.", "Si los adolescentes se aburren, usarlo como pausa de 30 minutos con aire, no museo completo."]}}}, {"num": "3", "time": "6:15–7:45 PM", "lat": 38.8848, "lon": -77.0258, "type": "museum", "gmaps": "https://www.google.com/maps/search/?api=1&query=International+Spy+Museum+700+L%27Enfant+Plaza+SW+Washington+DC", "en": {"name": "International Spy Museum", "address": "700 L'Enfant Plaza SW, Washington, DC", "desc": "Best stop for the boys. Buy timed tickets first. Treat it as a focused visit because the full museum can take longer.", "must": ["Undercover Mission — each visitor gets a cover identity.", "Interactive skill stations — memory, observation, risk, and decision challenges.", "Spy gadgets and disguise artifacts.", "Codebreaking, surveillance, and intelligence history.", "Debriefing Center — mission performance check at the end."], "interesting": ["This is not a Smithsonian; it is a paid independent museum.", "The Museum is at L’Enfant Plaza and is walkable to The Wharf."], "tips": {"Arrival/drop-off": ["Use 700 L’Enfant Plaza SW as the destination.", "For accessibility, use the ACE/L’Enfant garage route with elevators to Plaza level instead of trying to enter from Lower 10th Street."], "Parking": ["Best parking: L’Enfant Plaza / ACE garage near 420 10th St SW.", "Do not move to Wharf parking yet unless you are skipping Spy."], "Inside strategy": ["Let the boys control the interactive mission; grandparents can skip slower text-heavy areas.", "Do not start the gift shop until the end or you will lose time."], "Backup": ["If no tickets or arrival is after 6:45, skip Spy and go directly to The Wharf.", "If everyone is hungry, do Wharf first; Spy is not a dinner stop."]}}, "es": {"name": "Museo Internacional del Espionaje", "address": "700 L'Enfant Plaza SW, Washington, DC", "desc": "La mejor parada para los muchachos. Comprar boletos con horario primero. Hacerlo como visita enfocada porque el museo completo puede tomar más tiempo.", "must": ["Undercover Mission — cada visitante recibe una identidad secreta.", "Estaciones interactivas — memoria, observación, riesgo y decisiones.", "Gadgets de espionaje y objetos de disfraces.", "Códigos, vigilancia e historia de inteligencia.", "Debriefing Center — revisión del desempeño de la misión al final."], "interesting": ["No es Smithsonian; es un museo independiente de pago.", "Está en L’Enfant Plaza y se puede llegar caminando a The Wharf."], "tips": {"Llegada/bajada": ["Usar 700 L’Enfant Plaza SW como destino.", "Para accesibilidad, usar el garage ACE/L’Enfant con elevadores al nivel Plaza en vez de intentar entrar desde Lower 10th Street."], "Parking": ["Mejor parking: L’Enfant Plaza / ACE garage cerca de 420 10th St SW.", "No mover el carro al Wharf todavía salvo que vayan a saltar Spy."], "Estrategia adentro": ["Dejar que los muchachos controlen la misión interactiva; los abuelos pueden saltar áreas lentas con mucho texto.", "No empezar la tienda hasta el final o se pierde tiempo."], "Respaldo": ["Si no hay boletos o llegan después de 6:45, saltar Spy e ir directo a The Wharf.", "Si todos tienen hambre, hacer Wharf primero; Spy no es parada de cena."]}}}, {"num": "4", "time": "7:45–9:15 PM", "lat": 38.8792, "lon": -77.0261, "type": "food", "gmaps": "https://www.google.com/maps/search/?api=1&query=The+Wharf+760+Maine+Ave+SW+Washington+DC", "en": {"name": "The Wharf", "address": "760 Maine Ave SW, Washington, DC", "desc": "Dinner, waterfront walk, marina views, drinks, ice cream, and a lower-stress evening area after the museums.", "must": ["Recreation Pier — swings, seating, games, water views, and the Wharf Torch area.", "Transit Pier — water taxi area and people-watching.", "District Pier / District Square — restaurants, shops, and activity core.", "Municipal Fish Market / Market Pier — older DC waterfront feel.", "Waterfront promenade — easiest low-effort walk for grandparents."], "interesting": ["The Wharf is a whole waterfront district, not one attraction.", "It has more than 80 restaurants and shops, plus multiple piers."], "tips": {"Arrival/drop-off": ["If coming from Spy, walking is possible, but use a short Uber if grandparents are tired.", "Set the meeting point as Recreation Pier or CVS/800 Maine Ave if the group splits."], "Parking": ["First try if moving the car: Wharf Garage 1, 700 Water St SW.", "Better backup/reservable option: L’Enfant Plaza, 420 10th St SW, two blocks north.", "Official Wharf garages are open 24 hours but can be expensive and cannot be reserved."], "Inside strategy": ["Eat first if everyone is hungry; walk the waterfront after sunset.", "For low-effort version: dinner + function readStoredLang() {
  try {
    const v = localStorage.getItem('dc-map-lang');
    return (v === 'en' || v === 'es') ? v : null;
  } catch (e) { return null; }
}
let lang = readStoredLang() || 'en';
let mapMode = 'fallback';
let fallbackFilter = 'all';
let leafletMap = null;

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function listHtml(items) {
  return '<ul>' + (items || []).map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
}
function tipsHtml(tips) {
  return Object.keys(tips || {}).map(k => `<div class="tipGroup"><b>${escapeHtml(k)}</b>${listHtml(tips[k])}</div>`).join('');
}
function firstTipText(obj) {
  const keys = Object.keys(obj || {});
  if (!keys.length) return '';
  const k = keys[0];
  return `${k}: ${obj[k][0] || ''}`;
}
function colorFor(type) {
  if (type === 'monument') return '#047857';
  if (type === 'food') return '#b45309';
  if (type === 'start') return '#475569';
  return '#2563eb';
}

function renderCards() {
  document.getElementById('cards').innerHTML = stops.map(s => {
    const d = s[lang];
    return `<div class="card ${s.type}">
      <div class="cardTop"><span class="badge">${escapeHtml(s.num)}</span><div><b>${escapeHtml(s.time)}</b><br><span>${escapeHtml(d.name)}</span></div></div>
      <p>${escapeHtml(d.desc)}</p><div class="addr">${escapeHtml(d.address)}</div>
      <details open><summary>${labels[lang].tips}</summary>${tipsHtml(d.tips)}</details>
      <details><summary>${labels[lang].mustSee}</summary>${listHtml(d.must)}</details>
      <details><summary>${labels[lang].interesting}</summary>${listHtml(d.interesting)}</details>
      <a class="btn" href="${s.gmaps}" target="_blank" rel="noopener">${labels[lang].openMaps}</a>
    </div>`;
  }).join('');

  document.getElementById('parkingCards').innerHTML = parking.map(p => {
    const d = p[lang];
    return `<div class="parkingItem"><b>${escapeHtml(d.name)}</b><div class="addr">${escapeHtml(d.address)}</div>
      <p>${escapeHtml(d.desc)}</p>
      <details open><summary>${labels[lang].parkingTips}</summary>${listHtml(d.tips)}</details>
      <a class="btn secondary" href="${p.gmaps}" target="_blank" rel="noopener">${labels[lang].navigate}</a></div>`;

  document.getElementById('cutoffBullets').innerHTML = '<ul>' + labels[lang].cutoffBullets.map(x => `<li>${x}</li>`).join('') + '</ul>';
  document.getElementById('sources').innerHTML = sourceLinks.map(([name, url]) => `<a href="${url}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`).join('');
}

function setTextLabels() {
  Object.keys(labels[lang]).forEach(k => {

  });
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');
  document.documentElement.lang = lang;
}

function popupStop(s) {

function popupParking(p) {

function iconFor(type, num) {
  const color = colorFor(type);
  return L.divIcon({
    className:'customIcon',
    html:`<div style="background:${color};color:white;border:2px solid white;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:900;box-shadow:0 1px 6px rgba(0,0,0,.35);">${num}</div>`,
    iconSize:[30,30], iconAnchor:[15,15]
  });
}

function initLeafletMap() {
  if (!window.L || leafletMap) return false;
  mapMode = 'leaflet';
  leafletMap = L.map('map').setView([38.895, -77.036], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(leafletMap);
  stopLayer = L.layerGroup().addTo(leafletMap);
  parkingLayer = L.layerGroup().addTo(leafletMap);
  closureLayer = L.layerGroup().addTo(leafletMap);
  stopMarkers = [];
  parkingMarkers = [];
  closurePolys = [];

  const parkingIcon = L.divIcon({className:'parkingIcon', html:`<div style="background:#111827;color:white;border:2px solid white;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-weight:900;box-shadow:0 1px 6px rgba(0,0,0,.35);">P</div>`, iconSize:[28,28], iconAnchor:[14,14]});
  stops.forEach(s => {
    const m = L.marker([s.lat, s.lon], {icon:iconFor(s.type, s.num)}).bindPopup(popupStop(s));
    stopLayer.addLayer(m); stopMarkers.push([m, s]);
  });
  parking.forEach(p => {
    const m = L.marker([p.lat, p.lon], {icon:parkingIcon}).bindPopup(popupParking(p));
    parkingLayer.addLayer(m); parkingMarkers.push([m, p]);
  });
  L.polyline(stops.slice(0,6).map(s => [s.lat, s.lon]), {color:'#2563eb', weight:3, opacity:.55, dashArray:'7,7'}).addTo(leafletMap);
  closures.forEach(c => {
    const poly = L.polygon(c.coords, {color:'#dc2626', fillColor:'#dc2626', fillOpacity:.13, weight:2, dashArray:'5,5'})
      .bindPopup(`<div class="popupTitle">${escapeHtml(c[lang].name)}</div><div>${escapeHtml(c[lang].desc)}</div>`);
    closureLayer.addLayer(poly); closurePolys.push([poly, c]);
  });
  L.control.layers(null, {"Stops / Paradas":stopLayer, "Parking":parkingLayer, "Closure risk zones / Cierres":closureLayer}, {collapsed:false}).addTo(leafletMap);
  zoomItinerary();
  return true;
}

function renderFallbackMap(filterName = fallbackFilter) {
  mapMode = 'fallback';

  const mapEl = document.getElementById('map');
  const allPoints = stops.concat(parking);
  const minLat = Math.min(...allPoints.map(p => p.lat)) - 0.002;
  const maxLat = Math.max(...allPoints.map(p => p.lat)) + 0.002;
  const minLon = Math.min(...allPoints.map(p => p.lon)) - 0.004;
  const maxLon = Math.max(...allPoints.map(p => p.lon)) + 0.004;
  const project = (lat, lon) => {
    const x = 6 + ((lon - minLon) / (maxLon - minLon)) * 88;
    const y = 9 + ((maxLat - lat) / (maxLat - minLat)) * 82;
    return [x, y];
  };
  const visibleStops = stops.filter(s => {
    if (filterName === 'museums') return s.type === 'museum';
    if (filterName === 'wharf') return s.type === 'food' || s.en.name.includes('Spy');
    if (filterName === 'monuments') return s.type === 'monument';
    return true;
  });
  const line = stops.slice(0,6).map(s => project(s.lat, s.lon).join(',')).join(' ');
  const closureSvg = closures.map(c => {
    const pts = c.coords.map(([lat,lon]) => project(lat,lon).join(',')).join(' ');
    return `<polygon class="fallbackClosure" points="${pts}"><title>${escapeHtml(c[lang].name)}</title></polygon>`;
  }).join('');
  const stopBtns = visibleStops.map(s => {
    const [x,y] = project(s.lat, s.lon);
    return `<button class="fallbackMarker ${s.type}" style="left:${x}%;top:${y}%;background:${colorFor(s.type)};" onclick="showFallbackStop('${s.num}')" title="${escapeHtml(s[lang].name)}">${escapeHtml(s.num)}</button>`;
  }).join('');
  const parkingBtns = parking.map((p, i) => {
    const [x,y] = project(p.lat, p.lon);
    return `<button class="fallbackParking" style="left:${x}%;top:${y}%;" onclick="showFallbackParking(${i})" title="${escapeHtml(p[lang].name)}">P</button>`;
  }).join('');

  mapEl.innerHTML = `<div class="fallbackMap">
    <div class="fallbackTitle"><b>${labels[lang].title}</b><div class="mapError">${labels[lang].routeWarning}</div></div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;z-index:1;">
      ${closureSvg}
      <polyline class="fallbackLine" points="${line}"></polyline>
    </svg>
    ${stopBtns}
    ${parkingBtns}
    <div id="fallbackPopup" class="fallbackPopup" style="display:none"></div>
  </div>`;
}

function showFallbackStop(num) {
  const s = stops.find(x => x.num === String(num));
  if (!s) return;
  const el = document.getElementById('fallbackPopup');
  el.innerHTML = `<button class="closeBtn" onclick="hideFallbackPopup()">×</button>${popupStop(s)}`;
  el.style.display = 'block';
}
function showFallbackParking(idx) {
  const p = parking[idx];
  if (!p) return;
  const el = document.getElementById('fallbackPopup');
  el.innerHTML = `<button class="closeBtn" onclick="hideFallbackPopup()">×</button>${popupParking(p)}`;
  el.style.display = 'block';
}
function hideFallbackPopup() {
  const el = document.getElementById('fallbackPopup');
  if (el) el.style.display = 'none';
}

function refreshMapLanguage() {
  if (mapMode === 'leaflet') {
    stopMarkers.forEach(([m, s]) => m.setPopupContent(popupStop(s)));
    parkingMarkers.forEach(([m, p]) => m.setPopupContent(popupParking(p)));
    closurePolys.forEach(([poly, c]) => poly.setPopupContent(`<div class="popupTitle">${escapeHtml(c[lang].name)}</div><div>${escapeHtml(c[lang].desc)}</div>`));
  } else {
    renderFallbackMap();
  }
}

function setLang(newLang) {
  lang = newLang;
  try { localStorage.setItem('dc-map-lang', lang); } catch (e) {}
  setTextLabels();
  renderCards();
  refreshMapLanguage();
}

function leafletFit(points) {
  if (!leafletMap) return;
  leafletMap.fitBounds(L.latLngBounds(points.map(p => [p.lat, p.lon])), {padding:[35,35]});
}
function zoomItinerary() {
  if (mapMode === 'leaflet') leafletFit(stops);
  else renderFallbackMap('all');
}
function zoomMuseums() {
  const pts = stops.filter(s => s.type === 'museum');
  if (mapMode === 'leaflet') leafletFit(pts);
  else renderFallbackMap('museums');
}
function zoomWharf() {
  const pts = stops.filter(s => s.type === 'food' || s.en.name.includes('Spy')).concat(parking.filter(p => p.en.name.includes('Wharf') || p.en.name.includes('L’Enfant')));
  if (mapMode === 'leaflet') leafletFit(pts);
  else renderFallbackMap('wharf');
}
function zoomMonuments() {
  const pts = stops.filter(s => s.type === 'monument');
  if (mapMode === 'leaflet') leafletFit(pts);
  else renderFallbackMap('monuments');
}

function boot() {
  setTextLabels();
  renderCards();
  if (!initLeafletMap()) {
    renderFallbackMap('all');
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
