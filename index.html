<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>DC July 3 Bilingual Itinerary Map - Fixed Render</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
<style>
  :root {
    --bg:#0f172a; --card:#fff; --muted:#64748b; --text:#111827; --line:#e5e7eb;
    --accent:#2563eb; --warn:#dc2626; --amber:#b45309; --green:#047857; --shadow:0 1px 3px rgba(15,23,42,.08);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:var(--text); background:#f8fafc; }
  header { padding:15px 18px; background:var(--bg); color:white; display:flex; gap:12px; justify-content:space-between; align-items:flex-start; }
  header h1 { margin:0 0 6px; font-size:20px; line-height:1.15; }
  header p { margin:0; color:#cbd5e1; font-size:14px; line-height:1.35; }
  .langBtns { display:flex; gap:8px; flex:0 0 auto; }
  .langBtns button { border:1px solid rgba(255,255,255,.35); background:#1e293b; color:white; border-radius:999px; padding:8px 11px; font-weight:800; }
  .langBtns button.active { background:white; color:#0f172a; }
  .layout { display:grid; grid-template-columns:450px 1fr; min-height:calc(100vh - 80px); }
  aside { overflow:auto; max-height:calc(100vh - 80px); border-right:1px solid var(--line); background:#f8fafc; padding:14px; }
  #map { min-height:calc(100vh - 80px); width:100%; background:#e2e8f0; position:relative; overflow:hidden; }
  .sectionTitle { font-size:15px; margin:18px 0 8px; color:#0f172a; }
  .card,.parkingItem,.notice { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; box-shadow:var(--shadow); }
  .cardTop { display:flex; gap:10px; align-items:flex-start; }
  .badge { flex:0 0 auto; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:white; font-weight:900; background:var(--accent); }
  .monument .badge { background:var(--green); } .food .badge { background:var(--amber); } .start .badge { background:#475569; }
  p { font-size:13px; color:#334155; line-height:1.38; margin:8px 0; }
  .addr { font-size:12px; color:var(--muted); margin:6px 0 10px; }
  .btn { display:inline-block; text-decoration:none; font-size:13px; font-weight:800; padding:8px 10px; border-radius:10px; background:var(--accent); color:white; margin-top:8px; }
  .btn.secondary { background:#334155; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px; }
  .toolbar button { border:1px solid var(--line); background:white; border-radius:10px; padding:8px 10px; font-weight:800; }
  .legend { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px; color:#334155; margin-top:8px; }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .blue { background:var(--accent); } .green { background:var(--green); } .amber { background:var(--amber); } .red { background:var(--warn); }
  .leaflet-popup-content { font-size:13px; line-height:1.35; }
  .popupTitle { font-weight:900; margin-bottom:4px; }
  .popupBtn { display:inline-block; margin-top:7px; padding:6px 8px; border-radius:8px; background:#2563eb; color:white !important; text-decoration:none; font-weight:900; }
  .small { font-size:12px; color:#475569; }
  details { margin-top:8px; }
  summary { cursor:pointer; font-size:13px; font-weight:900; color:#0f172a; margin-top:8px; }
  ul { margin:7px 0 0 18px; padding:0; }
  li { font-size:12.5px; line-height:1.35; margin:5px 0; color:#334155; }
  .tipGroup { margin:8px 0 0; padding:8px 9px; border-radius:10px; background:#f8fafc; border:1px solid #e2e8f0; }
  .tipGroup b { display:block; font-size:12.5px; margin-bottom:3px; color:#0f172a; }
  .sourceLinks a { display:block; margin:6px 0; font-size:12px; color:#1d4ed8; }

  .tabs { display:flex; gap:6px; padding:8px 14px 0; background:var(--bg); }
  .tabs button {
    border:1px solid rgba(255,255,255,.3); border-bottom:none; background:#1e293b; color:#cbd5e1;
    padding:9px 16px; font-weight:800; border-radius:10px 10px 0 0; font-size:13px; cursor:pointer;
  }
  .tabs button.active { background:#f8fafc; color:#0f172a; }
  .guideWrap { max-width:980px; margin:0 auto; padding:16px 14px 40px; }
  .prefsPanel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:var(--shadow); margin-bottom:14px; }
  .chipRow { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .chip {
    border:1px solid var(--line); background:#f8fafc; color:#334155; border-radius:999px;
    padding:7px 12px; font-weight:800; font-size:12.5px; cursor:pointer;
  }
  .chip.active { background:var(--accent); border-color:var(--accent); color:white; }
  .paceRow .chip.active { background:#0f172a; border-color:#0f172a; }
  .guideMuseum { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:var(--shadow); margin-bottom:16px; }
  .guideMuseum h3 { margin:0 0 4px; font-size:16px; color:#0f172a; }
  .guideMeta { font-size:12px; color:var(--muted); }
  .planBar {
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:8px 10px;
    margin:10px 0 8px; font-size:12.5px; font-weight:800; color:#1e3a8a;
  }
  .exCard { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0; background:#fff; }
  .exCard.picked { border-color:var(--accent); background:#eff6ff; }
  .exTop { display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
  .exTop input { margin-top:3px; width:17px; height:17px; flex:0 0 auto; }
  .exName { font-weight:900; font-size:13.5px; color:#0f172a; }
  .exMeta { font-size:11.5px; font-weight:400; color:var(--muted); white-space:nowrap; }
  .exTags { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .exTag { font-size:10.5px; font-weight:800; background:#f1f5f9; border:1px solid #e2e8f0; color:#475569; border-radius:999px; padding:2px 8px; }
  .exTag.hit { background:#dbeafe; border-color:#93c5fd; color:#1d4ed8; }
  .noMatch { font-size:13px; color:var(--muted); padding:8px 2px; }
  .exNum {
    display:inline-grid; place-items:center; width:19px; height:19px; border-radius:50%;
    background:var(--accent); color:white; font-size:11px; font-weight:900; margin-right:4px; vertical-align:-4px;
  }
  .exCard.picked .exNum { background:var(--green); }
  .exCard.flash { outline:3px solid var(--accent); outline-offset:1px; }
  .museumMap { display:block; width:100%; height:auto; background:white; border:1px solid var(--line); border-radius:12px; margin:10px 0 4px; }
  .mapNote { font-size:11.5px; color:var(--muted); margin:2px 0 10px; }
  .knowList b { display:block; font-size:12px; color:#0f172a; margin-top:7px; }

  .fallbackMap {
    position:absolute; inset:0; background:
      radial-gradient(circle at 70% 70%, rgba(59,130,246,.16), transparent 28%),
      linear-gradient(135deg, rgba(255,255,255,.45) 0 25%, transparent 25% 50%, rgba(255,255,255,.45) 50% 75%, transparent 75%),
      #dbeafe;
    background-size:100% 100%, 34px 34px, auto;
  }
  .fallbackTitle {
    position:absolute; top:12px; left:12px; right:12px; z-index:5;
    background:rgba(255,255,255,.94); border:1px solid #cbd5e1; border-radius:14px; padding:10px 12px;
    box-shadow:var(--shadow); font-size:13px;
  }
  .fallbackMarker, .fallbackParking {
    position:absolute; transform:translate(-50%,-50%); z-index:4; border:2px solid white; color:white;
    box-shadow:0 1px 7px rgba(15,23,42,.35); cursor:pointer; display:grid; place-items:center; font-weight:900;
  }
  .fallbackMarker { width:31px; height:31px; border-radius:50%; background:var(--accent); }
  .fallbackMarker.monument { background:var(--green); }
  .fallbackMarker.food { background:var(--amber); }
  .fallbackMarker.start { background:#475569; }
  .fallbackParking { width:29px; height:29px; border-radius:8px; background:#111827; }
  .fallbackPopup {
    position:absolute; left:12px; right:12px; bottom:12px; z-index:6; background:white; border:1px solid #cbd5e1;
    border-radius:14px; padding:12px; box-shadow:0 6px 18px rgba(15,23,42,.22); max-height:38vh; overflow:auto;
  }
  .fallbackPopup .closeBtn { float:right; border:0; background:#e2e8f0; border-radius:8px; padding:4px 8px; font-weight:900; }
  .fallbackLine { stroke:#2563eb; stroke-width:3; stroke-dasharray:7 7; fill:none; opacity:.62; }
  .fallbackClosure { fill:rgba(220,38,38,.14); stroke:#dc2626; stroke-width:2; stroke-dasharray:5 5; }
  .mapError { color:#334155; margin-top:4px; font-size:12px; }
  @media (max-width:860px) {
    header { display:block; } .langBtns { margin-top:10px; } .layout { grid-template-columns:1fr; }
    aside { max-height:none; border-right:0; border-bottom:1px solid var(--line); } #map { min-height:70vh; }
  }
</style>
</head>

ircle Jefferson Drive/Independence Avenue for street parking today."], "Inside strategy": ["Pick three: Wright Flyer, Apollo 11 Columbia, How Things Fly.", "Set a hard exit alarm for 4:05 PM so the rest of the day survives."], "Backup": ["No timed pass: skip this stop and use American Art / Portrait Gallery as the first museum.", "If the group is hot/tired, do only Boeing Milestones plus Apollo 11, then leave."]}}, "es": {"name": "Museo Nacional del Aire y el Espacio", "address": "650 Jefferson Dr SW, Washington, DC", "desc": "Primera prioridad porque cierra más temprano y requiere pases gratuitos con horario. Hacerlo como visita de puntos principales, no como museo completo.", "must": ["1903 Wright Flyer — primer avión con motor que voló con éxito.", "Apollo 11 Command Module Columbia — uno de los objetos más importantes para ver.", "TEXTRON How Things Fly — interactivo y bueno para adolescentes.", "Boeing Milestones of Flight Hall — resumen rápido de aviación y espacio.", "Exhibiciones nuevas 2026 — varias galerías reabrieron el 1 de julio, así que puede haber demanda."], "interesting": ["Parte del museo sigue en transformación, así que conviene revisar exhibiciones abiertas y no asumir que todo lo antiguo está disponible.", "El pase permite quedarse dentro sin límite, pero si salen necesitan otro pase para reentrar."], "tips": {"Llegada/bajada": ["Bajar a los abuelos en la entrada de Jefferson Drive si el calor está fuerte.", "Si llegan tarde, no perder tiempo en el lobby; ir directo a los objetos principales."], "Parking": ["Mejor parking práctico: L’Enfant Plaza Garage, 420 10th St SW, y caminar o tomar Uber corto.", "Evitar dar vueltas por Jefferson Drive/Independence Avenue buscando calle hoy."], "Estrategia adentro": ["Escoger tres: Wright Flyer, Apollo 11 Columbia, How Things Fly.", "Poner alarma de salida a las 4:05 PM para que el resto del día funcione."], "Respaldo": ["Sin pase con horario: saltar este stop y empezar con American Art / Portrait Gallery.", "Si el grupo está cansado o con calor, hacer solo Boeing Milestones y Apollo 11, luego salir."]}}}, {"num": "2", "time": "4:25–6:00 PM", "lat": 38.8978, "lon": -77.023, "type": "museum", "gmaps": "https://www.google.com/maps/search/?api=1&query=Smithsonian+American+Art+Museum+8th+and+G+St+NW+Washington+DC", "en": {"name": "Smithsonian American Art Museum / National Portrait Gallery", "address": "8th & G St NW, Washington, DC", "desc": "Indoor AC, no ticket required, and open later than most Smithsonian museums. It shares one historic building with the National Portrait Gallery.", "must": ["Kogod Courtyard — best seated AC break.", "America’s Presidents — complete presidential portrait collection outside the White House.", "SAAM collection highlights — American art from early work to modern/contemporary.", "Historic Patent Office Building — the building itself is part of the visit.", "Latinx and American sculpture areas — good less-generic collection areas."], "interesting": ["This building was the old U.S. Patent Office.", "The courtyard is the recovery stop: sit, cool down, and reset before Spy Museum."], "tips": {"Arrival/drop-off": ["Use 8th & G St NW as the walking target.", "If someone is parking, drop the grandparents near the entrance and meet inside at Kogod Courtyard."], "Parking": ["Use a Gallery Place/Penn Quarter paid garage near 8th & G; do not plan around street parking.", "If traffic northbound looks ugly, skip this and stay near L’Enfant/Wharf."], "Inside strategy": ["Start with Kogod Courtyard first, not last.", "Do Presidents + one SAAM wing; do not split the group across multiple floors unless phones are charged."], "Backup": ["If arrival is after 5:30, make it only Kogod Courtyard + Presidents.", "If the teens are bored, use it as a 30-minute cooling stop, not a full museum."]}}, "es": {"name": "Museo Smithsonian de Arte Americano / Galería Nacional de Retratos", "address": "8th & G St NW, Washington, DC", "desc": "Con aire acondicionado, sin b function readStoredLang() {
  try {
    const v = localStorage.getItem('dc-map-lang');
    return (v === 'en' || v === 'es') ? v : null;
  } catch (e) { return null; }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function listHtml(items) {
  return '<ul>' + (items || []).map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
}
function tipsHtml(tips) {
  return Object.keys(tips || {}).map(k => `<div class="tipGroup"><b>${escapeHtml(k)}</b>${listHtml(tips[k])}</div>`).join('');
}
function firstTipText(obj) {
  const keys = Object.keys(obj || {});
  if (!keys.length) return '';
  const k = keys[0];
  return `${k}: ${obj[k][0] || ''}`;
}
function colorFor(type) {
  if (type === 'monument') return '#047857';
  if (type === 'food') return '#b45309';
  if (type === 'start') return '#475569';
  return '#2563eb';
}

function renderCards() {
  document.getElementById('cards').innerHTML = stops.map(s => {
    const d = s[lang];
    return `<div class="card ${s.type}">
      <div class="cardTop"><span class="badge">${escapeHtml(s.num)}</span><div><b>${escapeHtml(s.time)}</b><br><span>${escapeHtml(d.name)}</span></div></div>
      <p>${escapeHtml(d.desc)}</p><div class="addr">${escapeHtml(d.address)}</div>
      <details open><summary>${labels[lang].tips}</summary>${tipsHtml(d.tips)}</details>
      <details><summary>${labels[lang].mustSee}</summary>${listHtml(d.must)}</details>
      <details><summary>${labels[lang].interesting}</summary>${listHtml(d.interesting)}</details>
      <a class="btn" href="${s.gmaps}" target="_blank" rel="noopener">${labels[lang].openMaps}</a>
    </div>`;
  }).join('');

  document.getElementById('parkingCards').innerHTML = parking.map(p => {
    const d = p[lang];
    return `<div class="parkingItem"><b>${escapeHtml(d.name)}</b><div class="addr">${escapeHtml(d.address)}</div>
      <p>${escapeHtml(d.desc)}</p>
      <details open><summary>${labels[lang].parkingTips}</summary>${listHtml(d.tips)}</details>
      <a class="btn secondary" href="${p.gmaps}" target="_blank" rel="noopener">${labels[lang].navigate}</a></div>`;
  }).join('');

  document.getElementById('cutoffBullets').innerHTML = '<ul>' + labels[lang].cutoffBullets.map(x => `<li>${x}</li>`).join('') + '</ul>';
  document.getElementById('sources').innerHTML = sourceLinks.map(([name, url]) => `<a href="${url}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`).join('');
}

function setTextLabels() {
  Object.keys(labels[lang]).forEach(k => {
    const el = document.getElementById(k);
    if (el && typeof labels[lang][k] === 'string') el.textContent = labels[lang][k];
  });
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');
  document.documentElement.lang = lang;
}

function popupStop(s) {
  const d = s[lang];
  return `<div class="popupTitle">${escapeHtml(s.time)} — ${escapeHtml(d.name)}</div>
    <div>${escapeHtml(d.desc)}</div>
    <div class="small" style="margin-top:5px">${escapeHtml(firstTipText(d.tips))}</div>
    <div class="small" style="margin-top:5px">${escapeHtml(d.address)}</div>
    <a class="popupBtn" href="${s.gmaps}" target="_blank" rel="noopener">${labels[lang].openMaps}</a>`;
}
function popupParking(p) {
  const d = p[lang];
  return `<div class="popupTitle">${labels[lang].parking}: ${escapeHtml(d.name)}</div>
    <div>${escapeHtml(d.desc)}</div>
    <div class="small" style="margin-top:5px">${escapeHtml(d.address)}</div>
    <a class="popupBtn" href="${p.gmaps}" target="_blank" rel="noopener">${labels[lang].navigate}</a>`;
}

function iconFor(type, num) {
  const color = colorFor(type);
  return L.divIcon({
    className:'customIcon',
    html:`<div style="background:${color};color:white;border:2px solid white;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:900;box-shadow:0 1px 6px rgba(0,0,0,.35);">${num}</div>`,
    iconSize:[30,30], iconAnchor:[15,15]
  });
}

function initLeafletMap() {
  if (!window.L || leafletMap) return false;
  mapMode = 'leaflet';
  leafletMap = L.map('map').setView([38.895, -77.036], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(leafletMap);
  stopLayer = L.layerGroup().addTo(leafletMap);
  parkingLayer = L.layerGroup().addTo(leafletMap);
  closureLayer = L.layerGroup().addTo(leafletMap);
  stopMarkers = [];
  parkingMarkers = [];
  closurePolys = [];

  const parkingIcon = L.divIcon({className:'parkingIcon', html:`<div style="background:#111827;color:white;border:2px solid white;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-weight:900;box-shadow:0 1px 6px rgba(0,0,0,.35);">P</div>`, iconSize:[28,28], iconAnchor:[14,14]});
  stops.forEach(s => {
    const m = L.marker([s.lat, s.lon], {icon:iconFor(s.type, s.num)}).bindPopup(popupStop(s));
    stopLayer.addLayer(m); stopMarkers.push([m, s]);
  });
  parking.forEach(p => {
    const m = L.marker([p.lat, p.lon], {icon:parkingIcon}).bindPopup(popupParking(p));
    parkingLayer.addLayer(m); parkingMarkers.push([m, p]);
  });
  L.polyline(stops.slice(0,6).map(s => [s.lat, s.lon]), {color:'#2563eb', weight:3, opacity:.55, dashArray:'7,7'}).addTo(leafletMap);
  closures.forEach(c => {
    const poly = L.polygon(c.coords, {color:'#dc2626', fillColor:'#dc2626', fillOpacity:.13, weight:2, dashArray:'5,5'})
      .bindPopup(`<div class="popupTitle">${escapeHtml(c[lang].name)}</div><div>${escapeHtml(c[lang].desc)}</div>`);
    closureLayer.addLayer(poly); closurePolys.push([poly, c]);
  });
  L.control.layers(null, {"Stops / Paradas":stopLayer, "Parking":parkingLayer, "Closure risk zones / Cierres":closureLayer}, {collapsed:false}).addTo(leafletMap);
  zoomItinerary();
  return true;
}

function renderFallbackMap(filterName = fallbackFilter) {
  mapMode = 'fallback';
  fallbackFilter = filterName;
  const mapEl = document.getElementById('map');
  const allPoints = stops.concat(parking);
  const minLat = Math.min(...allPoints.map(p => p.lat)) - 0.002;
  const maxLat = Math.max(...allPoints.map(p => p.lat)) + 0.002;
  const minLon = Math.min(...allPoints.map(p => p.lon)) - 0.004;
  const maxLon = Math.max(...allPoints.map(p => p.lon)) + 0.004;
  const project = (lat, lon) => {
    const x = 6 + ((lon - minLon) / (maxLon - minLon)) * 88;
    const y = 9 + ((maxLat - lat) / (maxLat - minLat)) * 82;
    return [x, y];
  };
  const visibleStops = stops.filter(s => {
    if (filterName === 'museums') return s.type === 'museum';
    if (filterName === 'wharf') return s.type === 'food' || s.en.name.includes('Spy');
    if (filterName === 'monuments') return s.type === 'monument';
    return true;
  });
  const line = stops.slice(0,6).map(s => project(s.lat, s.lon).join(',')).join(' ');
  const closureSvg = closures.map(c => {
    const pts = c.coords.map(([lat,lon]) => project(lat,lon).join(',')).join(' ');
    return `<polygon class="fallbackClosure" points="${pts}"><title>${escapeHtml(c[lang].name)}</title></polygon>`;
  }).join('');
  const stopBtns = visibleStops.map(s => {
    const [x,y] = project(s.lat, s.lon);
    return `<button class="fallbackMarker ${s.type}" style="left:${x}%;top:${y}%;background:${colorFor(s.type)};" onclick="showFallbackStop('${s.num}')" title="${escapeHtml(s[lang].name)}">${escapeHtml(s.num)}</button>`;
  }).join('');
  const parkingBtns = parking.map((p, i) => {
    const [x,y] = project(p.lat, p.lon);
    return `<button class="fallbackParking" style="left:${x}%;top:${y}%;" onclick="showFallbackParking(${i})" title="${escapeHtml(p[lang].name)}">P</button>`;
  }).join('');

  mapEl.innerHTML = `<div class="fallbackMap">
    <div class="fallbackTitle"><b>${labels[lang].title}</b><div class="mapError">${labels[lang].routeWarning}</div></div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;z-index:1;">
      ${closureSvg}
      <polyline class="fallbackLine" points="${line}"></polyline>
    </svg>
    ${stopBtns}
    ${parkingBtns}
    <div id="fallbackPopup" class="fallbackPopup" style="display:none"></div>
  </div>`;
}

function showFallbackStop(num) {
  const s = stops.find(x => x.num === String(num));
  if (!s) return;
  const el = document.getElementById('fallbackPopup');
  el.innerHTML = `<button class="closeBtn" onclick="hideFallbackPopup()">×</button>${popupStop(s)}`;
  el.style.display = 'block';
}
function showFallbackParking(idx) {
  const p = parking[idx];
  if (!p) return;
  const el = document.getElementById('fallbackPopup');
  el.innerHTML = `<button class="closeBtn" onclick="hideFallbackPopup()">×</button>${popupParking(p)}`;
  el.style.display = 'block';
}
function hideFallbackPopup() {
  const el = document.getElementById('fallbackPopup');
  if (el) el.style.display = 'none';
}

function refreshMapLanguage() {
  if (mapMode === 'leaflet') {
    stopMarkers.forEach(([m, s]) => m.setPopupContent(popupStop(s)));
    parkingMarkers.forEach(([m, p]) => m.setPopupContent(popupParking(p)));
    closurePolys.forEach(([poly, c]) => poly.setPopupContent(`<div class="popupTitle">${escapeHtml(c[lang].name)}</div><div>${escapeHtml(c[lang].desc)}</div>`));
  } else {
    renderFallbackMap();
  }
}

function setLang(newLang) {
  lang = newLang;
  try { localStorage.setItem('dc-map-lang', lang); } catch (e) {}
  setTextLabels();
  renderCards();
  refreshMapLanguage();
  renderGuide();
}

function leafletFit(points) {
  if (!leafletMap) return;
  leafletMap.fitBounds(L.latLngBounds(points.map(p => [p.lat, p.lon])), {padding:[35,35]});
}
function zoomItinerary() {
  if (mapMode === 'leaflet') leafletFit(stops);
  else renderFallbackMap('all');
}
function zoomMuseums() {
  const pts = stops.filter(s => s.type === 'museum');
  if (mapMode === 'leaflet') leafletFit(pts);
  else renderFallbackMap('museums');
}
function zoomWharf() {
  const pts = stops.filter(s => s.type === 'food' || s.en.name.includes('Spy')).concat(parking.filter(p => p.en.name.includes('Wharf') || p.en.name.includes('L’Enfant')));
  if (mapMode === 'leaflet') leafletFit(pts);
  else renderFallbackMap('wharf');
}
function zoomMonuments() {
  const pts = stops.filter(s => s.type === 'monument');
  if (mapMode === 'leaflet') leafletFit(pts);
  else renderFallbackMap('monuments');
}

let currentTab = 'map';

function loadGuideState() {
  try {
    const s = JSON.parse(localStorage.getItem('dc-guide-state') || 'null');
    if (s) return {themes: new Set(s.themes || []), pace: s.pace === 'quick' ? 'quick' : 'full', picks: new Set(s.picks || []), museum: ['nasm', 'saam', 'spy'].includes(s.museum) ? s.museum : 'nasm'};
  } catch (e) {}
  return {themes: new Set(), pace: 'full', picks: new Set(), museum: 'nasm'};
}
const guideState = loadGuideState();
function saveGuideState() {
  try {
    localStorage.setItem('dc-guide-state', JSON.stringify({themes: [...guideState.themes], pace: guideState.pace, picks: [...guideState.picks], museum: guideState.museum}));
  } catch (e) {}
}
function setGuideMuseum(id) {
  guideState.museum = id;
  saveGuideState(); renderGuide();
}
function scrollToExhibit(id) {
  const el = document.getElementById('ex-' + id);
  if (!el) return;
  el.scrollIntoView({behavior: 'smooth', block: 'center'});
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1400);
}
function museumMapSvg(m, visible) {
  const route = [`${m.entrance.x},${m.entrance.y}`].concat(visible.map(ex => `${ex.x},${ex.y}`)).join(' ');
  const dividers = (m.dividers || []).map(y =>
    `<line x1="5" y1="${y}" x2="95" y2="${y}" stroke="#cbd5e1" stroke-width="0.4" stroke-dasharray="2 1.6"/>`).join('');
  const notes = (m.annotations || []).map(a =>
    `<text x="${a.x}" y="${a.y}" font-size="3" fill="#94a3b8" font-weight="700" text-anchor="middle">${escapeHtml(a[lang])}</text>`).join('');
  const stopsSvg = m.exhibits.map((ex, i) => {
    const on = visible.includes(ex);
    const picked = guideState.picks.has(m.id + '-' + i);
    return `<g onclick="scrollToExhibit('${m.id}-${i}')" style="cursor:pointer" opacity="${on ? 1 : 0.25}">
      <circle cx="${ex.x}" cy="${ex.y}" r="3.4" fill="${picked ? '#047857' : '#2563eb'}" stroke="white" stroke-width="0.7"/>
      <text x="${ex.x}" y="${ex.y + 1.2}" font-size="3.4" fill="white" font-weight="800" text-anchor="middle">${i + 1}</text>
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 100 63" class="museumMap" role="img" aria-label="${escapeHtml(labels[lang].mapTitle)}">
    <rect x="4" y="5" width="92" height="51" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.6"/>
    ${dividers}${notes}
    <polyline points="${route}" fill="none" stroke="#2563eb" stroke-width="0.9" stroke-dasharray="2.2 1.8" opacity="0.65"/>
    <circle cx="${m.entrance.x}" cy="${m.entrance.y}" r="2.6" fill="#0f172a" stroke="white" stroke-width="0.6"/>
    <text x="${m.entrance.x}" y="${m.entrance.y + 5.4}" font-size="3" fill="#0f172a" font-weight="800" text-anchor="middle">${escapeHtml(labels[lang].entrance)}</text>
    ${stopsSvg}
  </svg>`;
}
function toggleTheme(id) {
  guideState.themes.has(id) ? guideState.themes.delete(id) : guideState.themes.add(id);
  saveGuideState(); renderGuide();
}
function clearGuideFilters() {
  guideState.themes.clear();
  saveGuideState(); renderGuide();
}
function setPace(p) {
  guideState.pace = p;
  saveGuideState(); renderGuide();
}
function togglePick(id) {
  guideState.picks.has(id) ? guideState.picks.delete(id) : guideState.picks.add(id);
  saveGuideState(); renderGuide();
}
function exhibitMatches(ex) {
  if (guideState.pace === 'quick' && ex.pri > 1) return false;
  if (!guideState.themes.size) return true;
  return ex.themes.some(t => guideState.themes.has(t));
}

function renderGuide() {
  const el = document.getElementById('view-guide');
  if (!el) return;
  const t9 = labels[lang];
  const chips = guideThemes.map(t =>
    `<button class="chip ${guideState.themes.has(t.id) ? 'active' : ''}" onclick="toggleTheme('${t.id}')">${escapeHtml(t[lang])}</button>`
  ).join('') + (guideState.themes.size ? `<button class="chip" style="border-style:dashed" onclick="clearGuideFilters()">✕ ${escapeHtml(t9.clearFilters)}</button>` : '');
  const paceChips = ['quick', 'full'].map(p =>
    `<button class="chip ${guideState.pace === p ? 'active' : ''}" onclick="setPace('${p}')">${escapeHtml(p === 'quick' ? t9.paceQuick : t9.paceFull)}</button>`
  ).join('');

  const museumChips = guideMuseums.map(m =>
    `<button class="chip ${guideState.museum === m.id ? 'active' : ''}" onclick="setGuideMuseum('${m.id}')">${escapeHtml(m[lang].name)}</button>`
  ).join('');

  const m = guideMuseums.find(x => x.id === guideState.museum) || guideMuseums[0];
  const stop = stops.find(s => s.num === m.stopNum);
  const matched = m.exhibits.filter(exhibitMatches);
  const picked = m.exhibits.filter((ex, i) => guideState.picks.has(m.id + '-' + i));
  const pickedMin = picked.reduce((a, ex) => a + ex.min, 0);
  const cards = matched.length ? matched.map(ex => {
    const i = m.exhibits.indexOf(ex);
    const id = m.id + '-' + i;
    const isPicked = guideState.picks.has(id);
    const d = ex[lang];
    const tags = ex.themes.map(tid => {
      const th = guideThemes.find(x => x.id === tid);
      return `<span class="exTag ${guideState.themes.has(tid) ? 'hit' : ''}">${escapeHtml(th ? th[lang] : tid)}</span>`;
    }).join('');
    const know = (d.know && d.know.length) ? `<div class="knowList"><b>${escapeHtml(t9.knowLabel)}</b>${listHtml(d.know)}</div>` : '';
    return `<div class="exCard ${isPicked ? 'picked' : ''}" id="ex-${id}">
      <label class="exTop"><input type="checkbox" ${isPicked ? 'checked' : ''} onchange="togglePick('${id}')">
        <div>
          <div class="exName"><span class="exNum">${i + 1}</span>${escapeHtml(d.name)} <span class="exMeta">· ~${ex.min} min · ${escapeHtml(d.zone)}</span></div>
          <p style="margin:4px 0 0">${escapeHtml(d.desc)}</p>
          ${know}
          ${d.tip ? `<p class="small" style="margin:6px 0 0">💡 ${escapeHtml(d.tip)}</p>` : ''}
          <div class="exTags">${tags}</div>
        </div>
      </label>
    </div>`;
  }).join('') : `<div class="noMatch">${escapeHtml(t9.noMatch)}</div>`;

  const museumHtml = `<div class="guideMuseum">
    <h3>${escapeHtml(m[lang].name)}</h3>
    <div class="guideMeta">${stop ? escapeHtml(stop.time) + ' · ' + escapeHtml(stop[lang].address) : ''}</div>
    <p style="margin:6px 0 0">${escapeHtml(m[lang].note)}</p>
    ${museumMapSvg(m, matched)}
    <p class="mapNote">${escapeHtml(t9.mapNote)}</p>
    <div class="planBar">
      <span>✔ ${picked.length} ${escapeHtml(t9.planPicked)} · ${pickedMin} ${escapeHtml(t9.planMinutes)}</span>
      <span>${escapeHtml(t9.showingA)} ${matched.length} ${escapeHtml(t9.showingB)} ${m.exhibits.length} ${escapeHtml(t9.showingC)}</span>
    </div>
    ${picked.length ? '' : `<p class="small" style="margin:0 0 4px">${escapeHtml(t9.planHint)}</p>`}
    ${cards}
  </div>`;

  el.innerHTML = `<div class="prefsPanel">
    <h2 style="margin:0 0 6px;font-size:17px;">${escapeHtml(t9.guideTitle)}</h2>
    <p style="margin:0 0 8px">${escapeHtml(t9.guideIntro)}</p>
    <b class="small">${escapeHtml(t9.museumPick)}</b>
    <div class="chipRow">${museumChips}</div>
    <b class="small" style="display:block;margin-top:12px">${escapeHtml(t9.guideThemesLabel)}</b>
    <div class="chipRow">${chips}</div>
    <b class="small" style="display:block;margin-top:12px">${escapeHtml(t9.guidePaceLabel)}</b>
    <div class="chipRow paceRow">${paceChips}</div>
  </div>${museumHtml}`;
}

function setTab(tab) {
  currentTab = tab;
  document.getElementById('view-map').style.display = tab === 'map' ? '' : 'none';
  document.getElementById('view-guide').style.display = tab === 'guide' ? '' : 'none';
  document.getElementById('tabMap').classList.toggle('active', tab === 'map');
  document.getElementById('tabGuide').classList.toggle('active', tab === 'guide');
  if (tab === 'guide') renderGuide();
  if (tab === 'map' && leafletMap) setTimeout(() => leafletMap.invalidateSize(), 60);
}

function boot() {
  setTextLabels();
  renderCards();
  if (!initLeafletMap()) {
    renderFallbackMap('all');
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
